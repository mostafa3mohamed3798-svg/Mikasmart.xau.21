<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mika Pro Gold Pro</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>

<header class="topBar">

<div class="logo">
🛡️ Mika Pro Gold Pro
</div>

<div class="symbol">
XAUUSD
</div>

<div id="livePrice" class="price">
0.00
</div>

<div id="spread" class="spread">
Spread --
</div>

</header>


<section class="signalBox">

<div id="signal">

WAIT

</div>

<div id="confidence">

0%

</div>

</section>


<section class="targets">

<div class="card">

<h3>SL</h3>

<p id="sl">
--
</p>

</div>

<div class="card">

<h3>TP1</h3>

<p id="tp1">
--
</p>

</div>

<div class="card">

<h3>TP2</h3>

<p id="tp2">
--
</p>

</div>

<div class="card">

<h3>TP3</h3>

<p id="tp3">
--
</p>

</div>

</section>


<section class="filters">

<div class="filter">

<span>EMA</span>

<b id="emaStatus">
--
</b>

</div>

<div class="filter">

<span>VWAP</span>

<b id="vwapStatus">
--
</b>

</div>

<div class="filter">

<span>RSI</span>

<b id="rsiStatus">
--
</b>

</div>

<div class="filter">

<span>MACD</span>

<b id="macdStatus">
--
</b>

</div>

<div class="filter">

<span>ATR</span>

<b id="atrStatus">
--
</b>

</div>

<div class="filter">

<span>Volume</span>

<b id="volumeStatus">
--
</b>

</div>

</section>


<section class="chartPanel">

<div class="toolbar">

<button class="tf active" data-tf="1">1M</button>

<button class="tf" data-tf="5">5M</button>

<button class="tf" data-tf="15">15M</button>

<button class="tf" data-tf="60">1H</button>

</div>

<div id="chart"></div>

</section>


<section class="decision">

<h3>

سبب القرار

</h3>

<ul>

<li id="reason1">...</li>

<li id="reason2">...</li>

<li id="reason3">...</li>

<li id="reason4">...</li>

<li id="reason5">...</li>

</ul>

</section>


<section class="marketInfo">

<div>

Trend

<b id="trend">
--
</b>

</div>

<div>

Volatility

<b id="volatility">
--
</b>

</div>

<div>

Market

<b id="marketState">
--
</b>

</div>

</section>


<footer>

Mika Pro Gold Engine v1.0

</footer>

<script src="config.js"></script>
<script src="websocket.js"></script>
<script src="chart.js"></script>
<script src="indicators.js"></script>
<script src="engine.js"></script>
<script src="script.js"></script>

</body>

</html>
